# Docker Compose для smart-skidka-agents
# Multi-agent система автономного маркетинга для smart-skidka.ru
# 
# Запуск:
#   docker-compose up -d
#   docker-compose logs -f orchestrator
#
# Требования: Docker 20.10+, Docker Compose 2.0+

version: "3.9"

services:
  # === PostgreSQL — хранение результатов и памяти агентов ===
  postgres:
    image: postgres:16-alpine
    container_name: sk-agents-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: skidka_agents
      POSTGRES_USER: ${POSTGRES_USER:-agents}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_strong_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agents} -d skidka_agents"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sk-agents-network

  # === Redis — кэш, очереди, контекст агентов ===
  redis:
    image: redis:7-alpine
    container_name: sk-agents-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-changeme_redis_pass}
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sk-agents-network

  # === Оркестратор — главный контроллер ===
  orchestrator:
    build:
      context: ../
      dockerfile: assets/Dockerfile
    container_name: sk-agents-orchestrator
    restart: unless-stopped
    environment:
      # LLM API
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_MODEL: ${LLM_MODEL:-deepseek-chat}
      LLM_API_URL: ${LLM_API_URL:-https://api.deepseek.com/v1}
      
      # База данных
      DATABASE_URL: postgresql://${POSTGRES_USER:-agents}:${POSTGRES_PASSWORD:-changeme_strong_password}@postgres:5432/skidka_agents
      REDIS_URL: redis://:${REDIS_PASSWORD:-changeme_redis_pass}@redis:6379/0
      
      # Telegram
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      
      # Расписание
      CYCLE_INTERVAL: ${CYCLE_INTERVAL:-21600}
      DAILY_REPORT_HOUR: ${DAILY_REPORT_HOUR:-9}
      DAILY_REPORT_MINUTE: ${DAILY_REPORT_MINUTE:-0}
      
      # Логирование
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ENVIRONMENT: ${ENVIRONMENT:-production}
    volumes:
      - ../scripts:/app/scripts:ro
      - ../references:/app/references:ro
      - ../configs:/app/configs:ro
      - logs_data:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sk-agents-network

  # === Telegram Bot — интерфейс управления ===
  telegram-bot:
    build:
      context: ../
      dockerfile: assets/Dockerfile.bot
    container_name: sk-agents-telegram
    restart: unless-stopped
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      DATABASE_URL: postgresql://${POSTGRES_USER:-agents}:${POSTGRES_PASSWORD:-changeme_strong_password}@postgres:5432/skidka_agents
      REDIS_URL: redis://:${REDIS_PASSWORD:-changeme_redis_pass}@redis:6379/0
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sk-agents-network

  # === pgAdmin — управление БД (опционально) ===
  pgadmin:
    image: dpage/pgadmin4:8
    container_name: sk-agents-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@smart-skidka.ru}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "127.0.0.1:5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - sk-agents-network

  # === Redis Commander — управление Redis (опционально) ===
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: sk-agents-redis-ui
    restart: unless-stopped
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-changeme_redis_pass}
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      - redis
    networks:
      - sk-agents-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  logs_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  sk-agents-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/16

name: CI — Tests & Lint

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:  # manual trigger

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: agents_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: |
          playwright install chromium

      - name: Run database migrations
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/agents_test
        run: |
          alembic upgrade head

      - name: Create test project structure
        run: |
          mkdir -p /tmp/test_site
          cat > /tmp/test_site/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="ru">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>SmartSkidka — лучшие скидки и промокоды на товары из Китая</title>
            <meta name="description" content="Экономьте до 70% на покупках в AliExpress, TaoBao, 1688. Ежедневные скидки, купоны и промокоды на электронику, одежду, товары для дома.">
            <link rel="stylesheet" href="styles.css">
          </head>
          <body>
            <header>
              <nav>
                <a href="/">Главная</a>
                <a href="/electronics">Электроника</a>
                <a href="/clothing">Одежда</a>
                <a href="/home">Товары для дома</a>
                <a href="/beauty">Красота</a>
                <a href="/auto">Авто</a>
                <a href="/guides">Гайды</a>
              </nav>
            </header>
            <main>
              <section id="hero">
                <h1>SmartSkidka — умные скидки каждый день</h1>
                <p>Экономьте на покупках из Китая с нашими подборками лучших предложений.</p>
              </section>
              <section id="products">
                <h2>Популярные товары</h2>
                <div class="product-grid">
                  <div class="product-card">
                    <img src="img1.jpg" alt="Беспроводные наушники" loading="lazy">
                    <h3>Беспроводные наушники TWS</h3>
                    <p class="price">1 299 ₽</p>
                    <a href="/item/1" class="btn">Купить со скидкой</a>
                  </div>
                  <div class="product-card">
                    <img src="img2.jpg" alt="Смарт-часы" loading="lazy">
                    <h3>Смарт-часы с пульсометром</h3>
                    <p class="price">2 499 ₽</p>
                    <a href="/item/2" class="btn">Купить со скидкой</a>
                  </div>
                  <div class="product-card">
                    <img src="img3.jpg" alt="Портативная колонка" loading="lazy">
                    <h3>Портативная колонка Bluetooth</h3>
                    <p class="price">890 ₽</p>
                    <a href="/item/3" class="btn">Купить со скидкой</a>
                  </div>
                  <div class="product-card">
                    <img src="img4.jpg" alt="Робот-пылесос" loading="lazy">
                    <h3>Робот-пылесос с мокрой уборкой</h3>
                    <p class="price">8 990 ₽</p>
                    <a href="/item/4" class="btn">Купить со скидкой</a>
                  </div>
                </div>
              </section>
              <section id="categories">
                <h2>Категории</h2>
                <ul class="category-list">
                  <li><a href="/electronics">Электроника и гаджеты</a></li>
                  <li><a href="/clothing">Одежда и аксессуары</a></li>
                  <li><a href="/home">Товары для дома</a></li>
                  <li><a href="/beauty">Красота и здоровье</a></li>
                  <li><a href="/auto">Автотовары</a></li>
                  <li><a href="/jewelry">Ювелирные изделия</a></li>
                </ul>
              </section>
            </main>
            <footer>
              <p>© 2024 SmartSkidka. Все права защищены.</p>
              <p><a href="/about">О проекте</a> | <a href="/contact">Контакты</a></p>
            </footer>
            <script src="app.js"></script>
          </body>
          </html>
          EOF
          python3 -c "
          import json
          products = []
          for i in range(1, 21):
              products.append({
                  'id': i,
                  'itemId': f'item{i}',
                  'title': f'Товар номер {i} с длинным названием для SEO',
                  'price': 1000 + i * 50,
                  'image': f'img{i}.jpg',
                  'category': 'electronics' if i % 3 == 0 else 'clothing' if i % 3 == 1 else 'home',
                  'description': f'Подробное описание товара номер {i}. Это качественный товар из Китая с быстрой доставкой и гарантией. Отличные отзывы покупателей. Рекомендуем к покупке!',
                  'rating': 4.5 + (i % 5) * 0.1,
                  'reviews': 100 + i * 10,
                  'url': f'/item/{i}',
                  'badge': 'Хит' if i % 4 == 0 else '',
              })
          with open('/tmp/test_site/products.json', 'w', encoding='utf-8') as f:
              json.dump(products, f, ensure_ascii=False, indent=2)
          "
          cat > /tmp/test_site/app.js << 'EOF'
          // SmartSkidka App — основной JavaScript файл
          document.addEventListener('DOMContentLoaded', function() {
            console.log('SmartSkidka app loaded');
            initSearch();
            initFilters();
            initLazyLoad();
            initCart();
            initAnalytics();
          });
          function initSearch() {
            const searchInput = document.getElementById('search');
            if (searchInput) {
              searchInput.addEventListener('input', debounce(handleSearch, 300));
            }
          }
          function handleSearch(e) {
            const query = e.target.value.toLowerCase();
            const cards = document.querySelectorAll('.product-card');
            cards.forEach(card => {
              const title = card.querySelector('h3').textContent.toLowerCase();
              card.style.display = title.includes(query) ? '' : 'none';
            });
          }
          function debounce(fn, ms) {
            let timer;
            return function(...args) {
              clearTimeout(timer);
              timer = setTimeout(() => fn.apply(this, args), ms);
            };
          }
          function initFilters() {
            const filterButtons = document.querySelectorAll('.filter-btn');
            filterButtons.forEach(btn => {
              btn.addEventListener('click', () => {
                const category = btn.dataset.category;
                filterProducts(category);
              });
            });
          }
          function filterProducts(category) {
            const cards = document.querySelectorAll('.product-card');
            cards.forEach(card => {
              const cardCategory = card.dataset.category;
              card.style.display = (category === 'all' || cardCategory === category) ? '' : 'none';
            });
          }
          function initLazyLoad() {
            const images = document.querySelectorAll('img[loading="lazy"]');
            if ('IntersectionObserver' in window) {
              const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                  if (entry.isIntersecting) {
                    const img = entry.target;
                    img.src = img.dataset.src || img.src;
                    observer.unobserve(img);
                  }
                });
              });
              images.forEach(img => observer.observe(img));
            }
          }
          function initCart() {
            const cartButtons = document.querySelectorAll('.btn');
            cartButtons.forEach(btn => {
              btn.addEventListener('click', (e) => {
                e.preventDefault();
                const productId = btn.closest('.product-card').dataset.id;
                addToCart(productId);
              });
            });
          }
          function addToCart(productId) {
            let cart = JSON.parse(localStorage.getItem('cart') || '[]');
            cart.push(productId);
            localStorage.setItem('cart', JSON.stringify(cart));
            updateCartBadge();
          }
          function updateCartBadge() {
            const cart = JSON.parse(localStorage.getItem('cart') || '[]');
            const badge = document.getElementById('cart-badge');
            if (badge) badge.textContent = cart.length;
          }
          function initAnalytics() {
            if (typeof gtag !== 'undefined') {
              gtag('event', 'page_view', { page_title: document.title });
            }
          }
          EOF
          echo '{"site_name":"Test"}' > /tmp/test_site/site.json
          mkdir -p /tmp/test_site/guides
          echo '# Guide' > /tmp/test_site/guides/test.md
          sudo mkdir -p /var/www
          sudo ln -s /tmp/test_site /var/www/dealshub-miniapp
          sudo ln -s $PWD /opt/smart-skidka-agents

      - name: Run tests
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/agents_test
          REDIS_URL: redis://localhost:6379/0
          LLM_API_KEY: test-key
          TELEGRAM_BOT_TOKEN: test-token
          TELEGRAM_CHAT_ID: test-chat
          DASHBOARD_API_KEY: test-dashboard-key
          SECRETS_MASTER_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          PROJECT_ROOT: /tmp/test_site
        run: |
          python -m pytest tests/ -v --tb=short --cov=scripts --cov-report=xml --cov-report=term

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lint tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black isort

      - name: Run flake8
        run: |
          flake8 scripts/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Check black formatting
        run: |
          black --check scripts/ tests/

      - name: Check isort
        run: |
          isort --check-only scripts/ tests/

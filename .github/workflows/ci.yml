name: CI — Tests & Lint

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:  # manual trigger

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: agents_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: |
          playwright install chromium

      - name: Run database migrations
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/agents_test
        run: |
          alembic upgrade head

      - name: Create test project structure
        run: |
          mkdir -p /tmp/test-site
          echo '<!DOCTYPE html><html><head><title>SmartSkidka</title></head><body></body></html>' > /tmp/test-site/index.html
          echo '[{"id":1,"itemId":"item1","title":"Test"}]' > /tmp/test-site/products.json
          echo '{"site_name":"Test"}' > /tmp/test-site/site.json
          echo 'console.log("app")' > /tmp/test-site/app.js
          mkdir -p /tmp/test-site/guides
          echo '# Guide' > /tmp/test-site/guides/test.md
          ln -s /tmp/test-site /tmp/test_site
          sudo mkdir -p /var/www
          sudo ln -s /tmp/test-site /var/www/dealshub-miniapp
          sudo ln -s $PWD /opt/smart-skidka-agents

      - name: Run tests
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/agents_test
          REDIS_URL: redis://localhost:6379/0
          LLM_API_KEY: test-key
          TELEGRAM_BOT_TOKEN: test-token
          TELEGRAM_CHAT_ID: test-chat
          DASHBOARD_API_KEY: test-dashboard-key
          SECRETS_MASTER_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          PROJECT_ROOT: /tmp/test-site
        run: |
          python -m pytest tests/ -v --tb=short --cov=scripts --cov-report=xml --cov-report=term

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lint tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black isort

      - name: Run flake8
        run: |
          flake8 scripts/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Check black formatting
        run: |
          black --check scripts/ tests/

      - name: Check isort
        run: |
          isort --check-only scripts/ tests/

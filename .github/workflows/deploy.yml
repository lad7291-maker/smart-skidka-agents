name: Deploy to Production

on:
  push:
    branches: [master]
    tags: ['v*']

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: secrets.DEPLOY_HOST != ''
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            echo "=== Deploying Smart Skidka Agents ==="
            cd /opt/smart-skidka-agents
            
            # Pull latest code
            git fetch origin
            git reset --hard origin/master
            
            # Update Python dependencies
            .venv/bin/pip install -q -r requirements.txt
            
            # Restart services
            systemctl restart sk-agents-orchestrator.service
            systemctl restart sk-agents-dashboard.service
            systemctl restart sk-agents-bot.service
            
            # Verify status
            sleep 3
            systemctl is-active sk-agents-orchestrator.service
            systemctl is-active sk-agents-dashboard.service
            systemctl is-active sk-agents-bot.service
            
            echo "=== Deploy complete ==="

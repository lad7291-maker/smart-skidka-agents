name: Deploy to Production

on:
  push:
    branches: [master]
    tags: ['v*']

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push orchestrator image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./assets/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/orchestrator:${{ github.sha }}
            ghcr.io/${{ github.repository }}/orchestrator:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push bot image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./assets/Dockerfile.bot
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/bot:${{ github.sha }}
            ghcr.io/${{ github.repository }}/bot:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' && vars.DEPLOY_HOST != ''
    steps:
      - name: Deploy to server via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /opt/smart-skidka-agents
            docker-compose pull
            docker-compose up -d
            docker system prune -f
